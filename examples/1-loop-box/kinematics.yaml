# Four-point kinematics with p1, p2 incoming and p3, p4 outgoing, all
# on-shell massless (p_i^2 = 0).
#
# Mandelstams:  s = (p1+p2)^2 = 2 p1.p2
#               t = (p2+p3)^2 = 2 p2.p3
# Conservation: p1 + p2 + p3 + p4 = 0 -> p4 = -p1 - p2 - p3
# Consequence:  p1.p3 = -(s+t)/2
kinematics:
  incoming_momenta: [p1, p2]
  outgoing_momenta: [p3, p4]
  momentum_conservation:
    - [p4, "-p1 - p2 - p3"]
  kinematic_invariants:
    - [s,   2]
    - [t,   2]
    - [m12, 2]
    - [m22, 2]
  scalarproduct_rules:
    - [[p1, p1], 0]
    - [[p2, p2], 0]
    - [[p3, p3], 0]
    - [[p1, p2], "s/2"]
    - [[p2, p3], "t/2"]
    - [[p1, p3], "-(s + t)/2"]
